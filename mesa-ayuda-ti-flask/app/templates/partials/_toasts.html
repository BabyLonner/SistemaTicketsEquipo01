<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" id="zona-toasts" aria-live="polite">
  {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
  <div class="toast align-items-center{% if categoria == 'error' %} toast--error{% endif %}" role="{{ 'alert' if categoria == 'error' else 'status' }}" data-bs-delay="4000">
    <div class="d-flex">
      <div class="toast-body">{{ mensaje }}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
    </div>
  </div>
  {% endfor %}
</div>
