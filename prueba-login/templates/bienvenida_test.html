<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sesión Iniciada | {{ session.get('empresa_nombre') }}</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F1F5F9;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .welcome-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 40px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      border-top: 6px solid #2672C7;
    }
    .logo-wrapper {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .logo-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .badge-rol {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: #2672C7;
      color: #2672C7;
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.4rem;
      color: #0F172A;
      margin: 0 0 6px;
    }
    p {
      color: #64748B;
      font-size: 0.92rem;
      margin: 0 0 24px;
    }
    .btn-logout {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 10px;
      background: #0F172A;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="welcome-card">
    <div class="logo-wrapper">
      {% if session.get('empresa_logo') %}
        <img src="{{ session.get('empresa_logo') }}" alt="Logo {{ session.get('empresa_nombre') }}">
      {% else %}
        <strong>{{ session.get('empresa_nombre', 'TI')[:2] }}</strong>
      {% endif %}
    </div>
    <span class="badge-rol">{{ session.get('rol') }} · {{ session.get('empresa_nombre') }}</span>
    <h1>¡Hola, {{ session.get('nombre') }}!</h1>
    <p>Has ingresado a <strong>{{ session.get('empresa_titulo') }}</strong></p>
    <a class="btn-logout" href="{{ url_for('cerrar_sesion') }}">Cerrar sesión de prueba</a>
  </div>
</body>
</html>
